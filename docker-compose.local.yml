# EC-271: iPhoneカテゴリページE2Eテスト自動化
# ローカル開発用Docker Compose設定（PostgreSQLのみ）
#
# 使用方法:
#   docker-compose -f docker-compose.local.yml up -d
#   # フロントエンドとバックエンドは手動で起動
#   npm test

version: '3.8'

services:
  # PostgreSQLデータベース
  postgres:
    image: postgres:15-alpine
    container_name: ec-site-e2e-postgres-local
    environment:
      POSTGRES_DB: ahamo_dummy_demo2
      POSTGRES_USER: ahamo_user
      POSTGRES_PASSWORD: ahamo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahamo_user -d ahamo_dummy_demo2"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_local:
