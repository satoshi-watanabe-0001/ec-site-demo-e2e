# EC-271: iPhoneカテゴリページE2Eテスト自動化
# E2Eテスト実行ワークフロー

name: E2E Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  FRONTEND_URL: http://localhost:3000
  API_BASE_URL: http://localhost:8080

jobs:
  # APIテストのみ実行（バックエンドサービスが必要）
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ahamo_user
          POSTGRES_PASSWORD: ahamo_password
          POSTGRES_DB: ahamo_dummy_demo2
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout E2E repository
        uses: actions/checkout@v4

      - name: Checkout Backend repository
        uses: actions/checkout@v4
        with:
          repository: satoshi-watanabe-0001/ec-site-demo-backend
          path: backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Start Backend service
        working-directory: backend
        run: |
          ./gradlew bootRun &
          echo "Waiting for backend to start..."
          timeout 120 bash -c 'until curl -s http://localhost:8080/actuator/health > /dev/null 2>&1; do sleep 2; done'
          echo "Backend is ready"
        env:
          DB_NAME: ahamo_dummy_demo2
          DB_USERNAME: ahamo_user
          DB_PASSWORD: ahamo_password

      - name: Run API validation tests
        run: npx playwright test tests/api-validation.spec.ts --project=chromium
        env:
          API_BASE_URL: ${{ env.API_BASE_URL }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  # フルE2Eテスト（フロントエンドとバックエンドが必要）
  full-e2e-tests:
    name: Full E2E Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ahamo_user
          POSTGRES_PASSWORD: ahamo_password
          POSTGRES_DB: ahamo_dummy_demo2
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout E2E repository
        uses: actions/checkout@v4

      - name: Checkout Backend repository
        uses: actions/checkout@v4
        with:
          repository: satoshi-watanabe-0001/ec-site-demo-backend
          path: backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Frontend repository
        uses: actions/checkout@v4
        with:
          repository: satoshi-watanabe-0001/ec-site-demo-frontend
          path: frontend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Install Frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        working-directory: frontend
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ env.API_BASE_URL }}

      - name: Start Backend service
        working-directory: backend
        run: |
          ./gradlew bootRun &
          echo "Waiting for backend to start..."
          timeout 120 bash -c 'until curl -s http://localhost:8080/actuator/health > /dev/null 2>&1; do sleep 2; done'
          echo "Backend is ready"
        env:
          DB_NAME: ahamo_dummy_demo2
          DB_USERNAME: ahamo_user
          DB_PASSWORD: ahamo_password

      - name: Start Frontend service
        working-directory: frontend
        run: |
          pnpm run start &
          echo "Waiting for frontend to start..."
          timeout 60 bash -c 'until curl -s http://localhost:3000 > /dev/null 2>&1; do sleep 2; done'
          echo "Frontend is ready"
        env:
          PORT: 3000

      - name: Run all E2E tests
        run: npx playwright test --project=chromium
        env:
          FRONTEND_URL: ${{ env.FRONTEND_URL }}
          API_BASE_URL: ${{ env.API_BASE_URL }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # パフォーマンステスト
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [api-tests]
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ahamo_user
          POSTGRES_PASSWORD: ahamo_password
          POSTGRES_DB: ahamo_dummy_demo2
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout E2E repository
        uses: actions/checkout@v4

      - name: Checkout Backend repository
        uses: actions/checkout@v4
        with:
          repository: satoshi-watanabe-0001/ec-site-demo-backend
          path: backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Frontend repository
        uses: actions/checkout@v4
        with:
          repository: satoshi-watanabe-0001/ec-site-demo-frontend
          path: frontend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Install Frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        working-directory: frontend
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ env.API_BASE_URL }}

      - name: Start Backend service
        working-directory: backend
        run: |
          ./gradlew bootRun &
          echo "Waiting for backend to start..."
          timeout 120 bash -c 'until curl -s http://localhost:8080/actuator/health > /dev/null 2>&1; do sleep 2; done'
          echo "Backend is ready"
        env:
          DB_NAME: ahamo_dummy_demo2
          DB_USERNAME: ahamo_user
          DB_PASSWORD: ahamo_password

      - name: Start Frontend service
        working-directory: frontend
        run: |
          pnpm run start &
          echo "Waiting for frontend to start..."
          timeout 60 bash -c 'until curl -s http://localhost:3000 > /dev/null 2>&1; do sleep 2; done'
          echo "Frontend is ready"
        env:
          PORT: 3000

      - name: Run performance tests
        run: npx playwright test tests/performance.spec.ts --project=chromium
        env:
          FRONTEND_URL: ${{ env.FRONTEND_URL }}
          API_BASE_URL: ${{ env.API_BASE_URL }}

      - name: Upload performance test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 30
